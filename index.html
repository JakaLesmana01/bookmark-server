<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Server</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css?family=Inter:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic" rel="stylesheet" />
</head>
<body>
    <div class="app-container">
        <h1>Book Container</h1>
        <div class="input-container">
            <input type="text" id="bookmark-name" placeholder="Bookmark Name">
            <input type="text" id="bookmark-url" placeholder="Bookmark URL">
            <button id="add-bookmark">Add Bookmark</button>
        </div>
        <ul id="bookmark-list">
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
